# Self-hosted production stack: the app, a database, and a persistent volume for
# uploads. Put a TLS-terminating proxy (Caddy, nginx, Traefik, Cloudflare) in
# front of it — this exposes plain HTTP on 3000 and expects to be behind one.
#
#   cp .env.example .env    # set APP_URL, AUTH_SECRET, AUTH_TRUST_HOST=1, email
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy
#
# For development use docker-compose.yml (database only) or `npm run db:local`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-party_planner}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-party_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app container needs to reach it.
    expose:
      - "5432"

  app:
    build:
      context: .
      args:
        # Inlined into the client bundle at build time — see the Dockerfile.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read at runtime, so changing the domain is a restart, not a rebuild.
      APP_URL: ${APP_URL:?set APP_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Required: the app sits behind your reverse proxy.
      AUTH_TRUST_HOST: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-party_planner}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-party_planner}?schema=public
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      STORAGE_DRIVER: local
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    volumes:
      # STORAGE_DRIVER=local writes here. Without this volume every uploaded
      # banner and logo disappears on the next deploy.
      - uploads:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  uploads:
